name: Alerta de despliegue

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar programa Hola Mundo
        run: node hola-mundo.js

      - name: Notificar en ntfy
        run: |
          curl --fail --show-error --silent \
            -H "Title: 🚀🔥 Cambio detectado en main" \
            -H "Tags: rocket,github,devops,fire" \
            -H "Priority: high" \
            -d "📦 Repositorio: $GITHUB_REPOSITORY
            🌿 Rama: main
            🧾 Commit: $GITHUB_SHA
            ⚡ Evento: push
            ✅ Estado: Se subio nuevo codigo correctamente.
            
            🎉 ¡Todo está funcionando y listo para seguir!" \
            https://ntfy.sh/devops-itla